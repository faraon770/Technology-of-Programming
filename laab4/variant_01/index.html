<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 1 — Регистрация студента</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Регистрация студента</h1>
  <form id="studentForm" novalidate>
    <div class="field" data-field="fullName">
      <label for="fullName">ФИО</label>
      <input id="fullName" type="text" placeholder="Иванов Иван Иванович">
      <span class="error"></span>
    </div>
    <div class="field" data-field="email">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="name@example.com">
      <span class="error"></span>
    </div>
    <div class="field" data-field="course">
      <label for="course">Курс</label>
      <select id="course">
        <option value="">Выберите курс</option>
        <option value="1">1 курс</option>
        <option value="2">2 курс</option>
        <option value="3">3 курс</option>
        <option value="4">4 курс</option>
      </select>
      <span class="error"></span>
    </div>
    <div class="field" data-field="agree">
      <label class="opt"><input id="agree" type="checkbox"> Согласен с правилами</label>
      <span class="error"></span>
    </div>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <div id="result" class="result"></div>
</main>
<script src="script.js"></script>
</body>
</html>
