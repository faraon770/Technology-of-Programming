<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 12 — Регистрация на конференцию</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Регистрация на конференцию</h1>
  <form id="confForm" novalidate>
    <div class="field" data-field="fullName">
      <label for="fullName">ФИО</label>
      <input id="fullName" type="text">
      <span class="error"></span>
    </div>
    <div class="field" data-field="email">
      <label for="email">E-mail</label>
      <input id="email" type="email">
      <span class="error"></span>
    </div>
    <div class="field" data-field="role">
      <label for="role">Роль участника</label>
      <select id="role">
        <option value="">Выберите роль</option>
        <option>Слушатель</option>
        <option>Докладчик</option>
        <option>Организатор</option>
      </select>
      <span class="error"></span>
    </div>
    <fieldset class="field" data-field="sections">
      <legend>Секции</legend>
      <label class="opt"><input type="checkbox" name="section" value="Веб-разработка"> Веб-разработка</label>
      <label class="opt"><input type="checkbox" name="section" value="Искусственный интеллект"> Искусственный интеллект</label>
      <label class="opt"><input type="checkbox" name="section" value="Кибербезопасность"> Кибербезопасность</label>
      <label class="opt"><input type="checkbox" name="section" value="Мобильные приложения"> Мобильные приложения</label>
      <span class="hint" id="counter">Выбрано секций: 0</span>
      <span class="error"></span>
    </fieldset>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <div id="result" class="result"></div>
</main>
<script src="script.js"></script>
</body>
</html>
