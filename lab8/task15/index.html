<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задание 15. Каталог фильмов</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<h1>Задание 15. Каталог фильмов</h1>
<p class="sub">Название, жанр и рейтинг. Добавление, удаление и фильтрация по жанру.</p>
<div class="row"><input id="title" placeholder="Название"><input id="genre" placeholder="Жанр"><input id="rating" type="number" min="0" max="10" step="0.1" placeholder="Рейтинг"><button id="add">Добавить</button></div><p class="err"></p><div class="row"><select id="filter"></select></div><ul id="list"></ul>
</main>
