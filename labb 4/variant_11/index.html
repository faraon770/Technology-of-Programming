<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 11 — Запись к врачу</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Запись к врачу</h1>
  <form id="doctorForm" novalidate>
    <div class="field" data-field="fullName">
      <label for="fullName">ФИО</label>
      <input id="fullName" type="text">
      <span class="error"></span>
    </div>
    <div class="field" data-field="speciality">
      <label for="speciality">Специальность врача</label>
      <select id="speciality">
        <option value="">Выберите специальность</option>
        <option>Терапевт</option>
        <option>Хирург</option>
        <option>Окулист</option>
        <option>Невролог</option>
      </select>
      <span class="error"></span>
    </div>
    <div class="field" data-field="date">
      <label for="date">Дата приёма</label>
      <input id="date" type="date">
      <span class="error"></span>
    </div>
    <div class="field" data-field="time">
      <label for="time">Время (08:00–18:00)</label>
      <input id="time" type="time">
      <span class="error"></span>
    </div>
    <fieldset class="field" data-field="visit">
      <legend>Тип приёма</legend>
      <label class="opt"><input type="radio" name="visit" value="Первичный"> Первичный</label>
      <label class="opt"><input type="radio" name="visit" value="Повторный"> Повторный</label>
      <span class="error"></span>
    </fieldset>
    <button type="submit">Записаться</button>
  </form>
  <div id="result" class="result"></div>
</main>
<script src="script.js"></script>
</body>
</html>
