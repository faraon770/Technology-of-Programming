<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 9. Список товаров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="icon">📦</div>
      <div>
        <span class="badge">Лабораторная работа №6 · Задание 9</span>
        <h1>Список товаров</h1>
      </div>
    </div>
    <form id="form" class="row">
      <input id="name" type="text" placeholder="Товар" required>
      <input id="price" type="number" min="1" placeholder="Цена" style="max-width:100px" required>
      <button type="submit">Добавить</button>
    </form>
    <ul id="items"></ul>
    <p id="total" class="total"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
