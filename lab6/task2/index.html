<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 2. Счетчик</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="icon">🔢</div>
      <div>
        <span class="badge">Лабораторная работа №6 · Задание 2</span>
        <h1>Счетчик</h1>
      </div>
    </div>
    <div id="value" class="value">0</div>
    <div class="buttons">
      <button id="minus">-</button>
      <button id="reset" class="danger">Сброс</button>
      <button id="plus">+</button>
    </div>
    <p class="muted">Горячие клавиши: «+», «-», «0». История последних действий:</p>
    <ul id="history"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
